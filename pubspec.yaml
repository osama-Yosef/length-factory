name: length_factory
description: "Length Factory - Production-ready factory management & ordering system."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Cubit) + Dependency Injection
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3

  # Functional error handling (Either<Failure, T>) for the Domain layer
  dartz: ^0.10.1

  # Networking (Cloudinary REST upload)
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  go_router: ^14.6.1
  equatable: ^2.0.7

  # Invoices
  pdf: ^3.11.1
  printing: ^5.13.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
